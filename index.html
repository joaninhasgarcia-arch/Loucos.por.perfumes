<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#160b12">
  <meta name="description" content="Acesse nosso grupo de perfumes no WhatsApp.">
  <title>Grupo de Perfumes | Entre pelo WhatsApp</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      color-scheme: dark;
      --gold: #d9b878;
      --gold-light: #f1d9a7;
      --wine: #6f102b;
      --green: #20c765;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px 16px;
      font-family: Arial, Helvetica, sans-serif;
      color: #fff;
      background:
        radial-gradient(ellipse at 50% 0%, rgba(117, 26, 69, .34), transparent 48%),
        linear-gradient(145deg, #09070a 0%, #1b0c15 55%, #09070a 100%);
    }

    .page {
      width: 100%;
      max-width: 440px;
      text-align: center;
    }

    .eyebrow {
      display: inline-block;
      margin-bottom: 15px;
      color: var(--gold-light);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    h1 {
      margin-bottom: 10px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(29px, 8vw, 39px);
      font-weight: 500;
      line-height: 1.12;
      letter-spacing: .2px;
    }

    .subtitle {
      max-width: 340px;
      margin: 0 auto 24px;
      color: #d5cbd0;
      font-size: 15px;
      line-height: 1.55;
    }

    .image-frame {
      position: relative;
      overflow: hidden;
      width: min(100%, 390px);
      margin: 0 auto 25px;
      padding: 7px;
      border: 1px solid rgba(217, 184, 120, .72);
      border-radius: 22px;
      background: linear-gradient(135deg, rgba(241, 217, 167, .22), rgba(111, 16, 43, .2));
      box-shadow: 0 18px 55px rgba(0, 0, 0, .48), 0 0 35px rgba(137, 31, 78, .18);
    }

    .image-frame img {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      border-radius: 15px;
    }

    .cta-label {
      margin-bottom: 13px;
      color: #f2e7d4;
      font-size: 14px;
      line-height: 1.5;
    }

    .whatsapp-button {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 11px;
      width: 100%;
      min-height: 60px;
      padding: 16px 20px;
      border: 0;
      border-radius: 14px;
      background: linear-gradient(180deg, #28d66f, #16b957);
      color: #062b16;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: .35px;
      text-decoration: none;
      box-shadow: 0 9px 24px rgba(20, 190, 89, .24);
      transition: transform .18s ease, filter .18s ease, box-shadow .18s ease;
    }

    .whatsapp-button:hover {
      filter: brightness(1.06);
      transform: translateY(-2px);
      box-shadow: 0 12px 28px rgba(20, 190, 89, .32);
    }

    .whatsapp-button:active {
      transform: translateY(0);
    }

    .whatsapp-icon {
      width: 25px;
      height: 25px;
      flex: 0 0 25px;
    }

    .note {
      margin-top: 17px;
      color: #a99ba2;
      font-size: 12px;
      line-height: 1.5;
    }

    .bottom-line {
      width: 54px;
      height: 1px;
      margin: 27px auto 0;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
    }

    @media (max-width: 360px) {
      body { padding: 22px 13px; }
      .subtitle { font-size: 14px; }
      .whatsapp-button { font-size: 13px; padding-inline: 12px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .whatsapp-button { transition: none; }
    }
  </style>
</head>
